<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Configure the global monospace fallback stack -->
    <match target="pattern">
        <test qual="any" name="family"><string>monospace</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <!-- 1. Your primary coding font choice -->
            <string>Hack Nerd Font Mono</string>
        </edit>
        <edit name="family" mode="append" binding="weak">
            <!-- 2. Traditional Powerline symbols if the main font misses a glyph -->
            <string>PowerlineSymbols</string>
            <!-- 3. Your color emojis at the bottom of the stack -->
            <string>Noto Color Emoji</string>
        </edit>
    </match>
</fontconfig>
